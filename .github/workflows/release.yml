name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check the version matches the tag
        run: |
          plist="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$plist" != "$RELEASE_TAG" ]; then
            echo "::error::Info.plist says $plist but the tag is $RELEASE_TAG"
            exit 1
          fi

      - name: Run tests
        run: xcrun swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent RouteBar.app RouteBar.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" RouteBar.zip --clobber
          else
            gh release create "$RELEASE_TAG" RouteBar.zip --generate-notes --title "RouteBar ${RELEASE_TAG#v}"
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-cask
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TAP_REPOSITORY: spilneo/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      # Without a token the tap's own scheduled workflow picks the release up instead.
      - name: Check for a tap token
        id: token
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is not set. $TAP_REPOSITORY updates itself on its next scheduled run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Check out tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Publish cask
        if: steps.token.outputs.present == 'true'
        env:
          ROUTEBAR_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/update-cask.sh "$RELEASE_TAG" tap/Casks/routebar.rb
          cd tap
          if git diff --quiet -- Casks/routebar.rb && git ls-files --error-unmatch Casks/routebar.rb >/dev/null 2>&1; then
            echo "The tap already has RouteBar ${RELEASE_TAG#v}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/routebar.rb
          git commit -m "routebar ${RELEASE_TAG#v}"
          git push origin HEAD
